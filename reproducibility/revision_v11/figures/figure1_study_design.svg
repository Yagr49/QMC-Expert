    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(265.927627 348.999031)">Potency ranking</text>
   </g>
   <g id="text_9">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(551.918055 324.835781)">Target refitting on Q-HERO-405</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(507.554539 336.917406)">Shared cation-scaffold folds; paired loss contrasts</text>
