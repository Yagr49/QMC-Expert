    <text style="font: 700 12px 'DejaVu Sans'; text-anchor: start" x="19.57599" y="24.814125" transform="rotate(-0 19.57599 24.814125)">A   Partial backbone fine-tuning</text>
   </g>
   <g id="text_2">
    <text style="font: 700 12px 'DejaVu Sans'; text-anchor: start" x="432.10899" y="24.814125" transform="rotate(-0 432.10899 24.814125)">B   Matched-molecule frozen-feature interventions</text>
   </g>
   <g id="text_3">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(143.926738 84.993766)">Eligible source collections</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(99.443731 97.133578)">740 expert molecules | 1,153 MIC molecules</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(162.135567 109.479422)">9,338 MIC records</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(135.797559 121.561047)">Evaluation full salts excluded</text>
   </g>
   <g id="text_4">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(519.150477 84.832562)">Identical source molecules within each panel</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(518.009734 96.972375)">681 pooled panel | 529 exact S. aureus panel</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(539.40032 109.318219)">Expert / continuous MIC / binary MIC</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(502.930711 121.458031)">Shuffled controls | untrained encoder | raw features</text>
   </g>
   <g id="text_5">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(135.822051 212.263781)">Train upper MolFormer layers</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(112.59084 224.345406)">Embedding + lowest four layers frozen</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(84.882754 236.427031)">3 source-training seeds; sources differ in exposure</text>
   </g>
   <g id="text_6">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(532.796336 212.263781)">Frozen backbone + 256 → 128 encoder</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(521.781531 224.345406)">Paired weights, scaffold split and 80 epochs</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(537.985711 236.427031)">5 seeds; evaluation cations excluded</text>
   </g>
   <g id="text_7">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(71.16999 324.835781)">Target refitting</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(76.100342 336.917406)">Q-HERO-411</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(72.089561 348.999031)">Scaffold-CV R²</text>
   </g>
   <g id="text_8">
